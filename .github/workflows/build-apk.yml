name: Nexus Browser APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Dosya yapısını kontrol et
        run: |
          echo "--- Kök dizin ---"
          ls -la
          if [ ! -f settings.gradle.kts ] || [ ! -f app/build.gradle.kts ]; then
            echo "HATA: settings.gradle.kts veya app/build.gradle.kts kök dizinde bulunamadı."
            echo "Dosyalar bir alt klasörün içinde kalmış olabilir; hepsi reponun EN ÜSTÜNDE olmalı."
            exit 1
          fi
          test -f app/src/main/java/com/nexus/browser/MainActivity.kt || { echo "HATA: MainActivity.kt eksik"; exit 1; }

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Debug APK oluştur
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK yolunu göster
        run: ls -la app/build/outputs/apk/debug/

      - name: APK'yı yükle (Artifacts bölümünden indirilecek)
        uses: actions/upload-artifact@v4
        with:
          name: NexusBrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

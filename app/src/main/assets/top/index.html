<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="tabstrip" id="tabstrip">
    <div class="tabs" id="tabs"></div>
    <button class="mini-btn" id="newTabBtn" title="Yeni sekme">+</button>
    <button class="mini-btn" id="newPrivateTabBtn" title="Gizli sekme">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
    </button>
  </div>

  <div class="toolbar">
    <button id="backBtn" class="icon-btn" title="Geri"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="forwardBtn" class="icon-btn" title="İleri"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>

    <div class="address-bar-wrap">
      <svg class="lock-icon" id="lockIcon" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14v10H5z"/></svg>
      <input id="addressBar" class="address-bar" type="text" placeholder="Adres yazın veya arayın" autocomplete="off" spellcheck="false" />
      <button id="starBtn" class="icon-btn ghost" title="Yer imi"><svg viewBox="0 0 24 24"><path d="M12 17.3 6.2 21l1.6-6.6L2.5 9.7l6.7-.6L12 3l2.8 6.1 6.7.6-5.3 4.7L18 21z"/></svg></button>
    </div>
    <div class="suggest-box" id="suggestBox"></div>

    <button id="reloadBtn" class="icon-btn" title="Yenile"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v6h-6"/></svg></button>
    <button id="menuBtn" class="icon-btn" title="Menü"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
  </div>

  <script src="js/renderer.js"></script>
</body>
</html>
